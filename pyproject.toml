[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-crud-generator"
version = "0.1.0"
description = "CRUD route generator for FastAPI"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "pydantic",
]

[project.optional-dependencies]
sqlmodel = ["sqlmodel"]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["fastapi_crud_generator"]
