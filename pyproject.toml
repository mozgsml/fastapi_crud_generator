[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-crud-generator"
version = "0.2.0"
description = "Generate full CRUD REST endpoints for FastAPI straight from your ORM models — filtering, sorting, pagination and nested resources, without hand-writing a single schema. Works with SQLModel, SQLAlchemy and Tortoise ORM."
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.11"
authors = [
    { name = "Nikolai Lukianov", email = "laserwargpt@gmail.com" },
]
keywords = ["fastapi", "crud", "rest", "api", "sqlmodel", "sqlalchemy", "tortoise"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastapi",
    "pydantic",
]

[project.urls]
Homepage = "https://github.com/mozgsml/fastapi_crud_generator"
Repository = "https://github.com/mozgsml/fastapi_crud_generator"
Issues = "https://github.com/mozgsml/fastapi_crud_generator/issues"

[project.optional-dependencies]
sqlmodel = ["sqlmodel"]
sqlalchemy = ["sqlalchemy[asyncio]"]
tortoise = ["tortoise-orm>=1.1.7"]

[tool.hatch.build.targets.wheel]
packages = ["fastapi_crud_generator"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
ignore = ["EM101", "TRY003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]
sqlmodel = [
    "sqlmodel",
]
sqlalchemy = [
    "sqlalchemy[asyncio]",
]
sqlite = [
    "aiosqlite",
]
postgresql = [
    "asyncpg",
]
mysql = [
    "aiomysql",
    "cryptography",
]
tortoise = [
    "tortoise-orm>=1.1.7",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "griffe-inherited-docstrings",
]
