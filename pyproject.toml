[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-crud-generator"
version = "0.1.0"
description = "CRUD route generator for FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
]

[project.optional-dependencies]
sqlmodel = ["sqlmodel"]

[tool.hatch.build.targets.wheel]
packages = ["fastapi_crud_generator"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
ignore = ["EM101", "TRY003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ipykernel>=7.2.0",
]
sqlmodel = [
    "sqlmodel",
]
sqlite = [
    "aiosqlite",
]
postgresql = [
    "asyncpg",
]
mysql = [
    "aiomysql",
    "cryptography",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "griffe-inherited-docstrings",
]
sqlalchemy = [
    "sqlalchemy[asyncio]",
]
tortoise = [
    "tortoise-orm>=1.1.7",
]
